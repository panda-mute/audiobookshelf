name: Build STRM Docker Image

# 构建 STRM 定制版 Docker 镜像并推送到 Docker Hub 及 GitHub Container Registry (GHCR)。
# 触发方式：
#   1) 推送 master 分支自动构建 latest
#   2) 推送版本 tag（如 v2.36.1 或 strm-v2.36.1）自动构建版本 tag + latest
#   3) 在 Actions 页面手动运行 (workflow_dispatch)，支持输入自定义 tag
#   4) 被 auto-update-strm.yml 自动调用 (workflow_call)
#
# 依赖 Secrets (非必填，填入即推送 Docker Hub):
#   - DOCKERHUB_USERNAME: Docker Hub 用户名
#   - DOCKERHUB_TOKEN 或 DOCKERHUB_PASSWORD: Docker Hub 访问令牌或密码

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - 'strm-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 2.36.1 或 latest）'
        required: true
        default: 'latest'
  workflow_call:
    inputs:
      ref:
        description: '要构建的 git ref（分支/tag/sha）'
        required: false
        type: string
      image_tag:
        description: '镜像版本 tag（如 2.36.1）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: dockerhub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKERHUB_PASSWORD != '') }}
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: 计算镜像 tags
        id: tags
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_TAG: ${{ inputs.tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_LOGGED_IN: ${{ steps.dockerhub.outcome == 'success' }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/audiobookshelf-strm
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            V="$INPUT_IMAGE_TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#strm-v}"
            V="${V#v}"
          else
            V="latest"
          fi

          TAGS="${GHCR_REPO}:${V}"
          if [ "$V" != "latest" ]; then
            TAGS="${TAGS},${GHCR_REPO}:latest"
          fi

          if [ "$DOCKERHUB_LOGGED_IN" = "true" ] && [ -n "$DOCKERHUB_USER" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/audiobookshelf-strm:${V}"
            if [ "$V" != "latest" ]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/audiobookshelf-strm:latest"
            fi
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "✅ Docker Hub 登录成功，将同时推送至 GHCR 和 Docker Hub"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            if [ -n "$DOCKERHUB_USER" ]; then
              echo "::warning::Docker Hub 登录失败（凭证无效或未通过验证），跳过 Docker Hub 推送，本次仅推送到 GHCR"
            fi
          fi

          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "tag=${V}" >> "$GITHUB_OUTPUT"
          echo "将构建并推送 tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
